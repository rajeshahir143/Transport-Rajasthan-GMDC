
name: Rajasthan GMDC - Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile main.py db.py po_builty.py pdf_parser.py pdf_render.py swastik_import.py

      - name: Run available tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No automated tests directory found; syntax check completed."
          fi
