name: Rajasthan GMDC - Build and Test EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check Python syntax
        run: |
          python -m py_compile main.py db.py po_builty.py pdf_parser.py pdf_render.py swastik_import.py

      - name: Run unit tests when available
        shell: pwsh
        run: |
          if (Test-Path "tests") {
            python -m unittest discover -s tests -v
          } else {
            Write-Host "No tests directory found. Syntax check completed; functional GUI/PDF/database tests remain manual."
          }

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Rajasthan_GMDC --collect-all reportlab --collect-all fitz --collect-all PIL --hidden-import=pypdf --hidden-import=uharfbuzz main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rajasthan-GMDC-Windows-EXE
          path: dist/Rajasthan_GMDC.exe
          if-no-files-found: error
          retention-days: 30
